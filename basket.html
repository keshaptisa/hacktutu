<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Туту Рядом · Корзина</title>
    <meta
      name="description"
      content="Корзина Туту Рядом со ссылками на реальные бронирования из Tutu MCP."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Prata&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="basket-page">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="tutu-logo">Туту</div>
          <div class="brand-copy">
            <span class="brand-name">Рядом</span>
            <p class="brand-subline">Поездки рядом на пару свободных дней</p>
          </div>
        </div>
      </header>

      <main class="basket-shell">
        <section class="basket-card basket-hero">
          <p class="eyebrow" style="color: var(--accent);">Корзина бронирований</p>
          <h1 id="basket-title">Собираем реальные ссылки на Туту…</h1>
          <p class="basket-copy" id="basket-copy">
            Здесь появятся ссылки на транспорт и проживание, если Tutu MCP вернул их в сценарии.
          </p>
          <div class="basket-actions">
            <a class="ghost-button" href="/">← Вернуться к подбору</a>
          </div>
        </section>

        <section class="basket-card">
          <h2>Что можно оформить сейчас</h2>
          <div class="basket-grid" id="basket-grid"></div>
        </section>
      </main>
    </div>

    <script src="/static/basket.js"></script>
  </body>
</html>
